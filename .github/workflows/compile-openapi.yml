name: Compile TypeSpec & Sync OpenAPI

on:
  push:
    branches:
      - dev
    paths:
      - 'src/**'  
      - 'tspconfig.yaml'
      - 'package.json'

permissions:
  contents: write 

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Override destination specifically for the CI build
      - name: Compile TypeSpec to committed docs path
        run: |
          npx tsp compile docs/api_docs/src/main.tsp --output-dir "{project-root}/generated-docs"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/openapi.yaml

          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore(docs): auto-generate openapi.yaml [skip ci]"
            git push origin main
          fi